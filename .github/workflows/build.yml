name: Build Windows installer

on:
  workflow_dispatch:        # Actions tab → "Run workflow"
  push:
    tags: ["v*"]            # git tag v1.7 && git push --tags → builds + publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name "PDF Facile" --icon icon.ico --add-data "icon.ico;." pdf_facile.py

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path pdf_facile.py -Pattern 'APP_VERSION = "(.+?)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $v in pdf_facile.py"; exit 1
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Installer-PDF-Facile
          path: dist/Installer-PDF-Facile.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Installer-PDF-Facile.exe
          generate_release_notes: true
          body: |
            **Pour installer ou mettre à jour :** téléchargez `Installer-PDF-Facile.exe` ci-dessous, puis double-cliquez dessus.

            Au premier lancement, Windows peut afficher « Windows a protégé votre ordinateur » : cliquez sur **Informations complémentaires**, puis **Exécuter quand même**.
